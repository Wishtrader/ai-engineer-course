<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineer Course — cost-router</title>
<meta name="description" content="Интерактивный курс по проекту cost-router: шаги, задания, прогресс, напоминания.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M18 44 L32 18 L46 44' stroke='%23f5c451' stroke-width='5' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">

  <div class="scrim" id="scrim" hidden></div>

  <aside class="rail" id="rail">
    <div class="rail-head">
      <button class="rail-close" id="railClose" type="button" aria-label="Закрыть меню">✕</button>
      <div class="brand">
        <span class="brand-mark">⌘</span>
        <div>
          <div class="brand-title">cost-router</div>
          <div class="brand-sub">курс → трек B</div>
        </div>
      </div>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
          <circle class="ring-fg" id="ringFg" cx="22" cy="22" r="18"></circle>
        </svg>
        <div class="ring-label"><span id="ringPct">0%</span><small>курс</small></div>
      </div>

      <button class="resume" id="resumeBtn" type="button">Продолжить →</button>
    </div>

    <nav class="nav" id="nav" aria-label="Шаги курса"></nav>

    <div class="rail-foot">
      <button class="ghost" id="planBtn" type="button">План: 7 фаз трека B</button>
      <button class="ghost" id="examBtn" type="button">Экзамены</button>
      <button class="ghost" id="remindBtn" type="button">Напоминания</button>
      <button class="ghost" id="dataBtn" type="button">Данные прогресса</button>
      <div class="foot-note">прогресс хранится локально<br>в этом браузере</div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="menu" id="menuBtn" type="button" aria-label="Меню">☰</button>
      <div class="crumbs" id="crumbs">Шаг 1</div>
      <div class="topbar-right">
        <span class="stat" id="statChecked">0 / 0 пунктов</span>
        <button class="pill" id="quickSearch" type="button">⌕ поиск</button>
        <button class="pill" id="quickRemind" type="button">⏰ напомнить</button>
      </div>
    </header>

    <div class="banner" id="staleBanner" hidden></div>

    <article class="article" id="article" aria-live="polite"></article>

    <footer class="foot">
      <span>cost-router · фаза 0 трека B</span>
      <span id="footNote">локальный прогресс · export/import в меню</span>
    </footer>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="sheet-head">
      <h2 id="sheetTitle">—</h2>
      <button class="icon" id="sheetClose" type="button" aria-label="Закрыть">✕</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="course.js"></script>
<script src="practice.js"></script>
<script src="exams.js"></script>
<script src="app.js"></script>
</body>
</html>
